<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="MIRIN" />
    <meta name="description" content="MIRIN — a personal workout tracker for logging progressive overload with minimal friction." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MIRIN</title>
    <script>
      (function () {
        var mode = "dark";
        try {
          var raw = localStorage.getItem("mirin.appearance");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (
              parsed.mode === "light" ||
              parsed.mode === "system" ||
              parsed.mode === "dark"
            ) {
              mode = parsed.mode;
            }
          }
        } catch (e) {}
        var resolved =
          mode === "system"
            ? window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : mode;
        document.documentElement.dataset.mode = resolved;
        document.documentElement.style.colorScheme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute(
            "content",
            resolved === "light" ? "#f3f2ef" : "#0a0a0a",
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
